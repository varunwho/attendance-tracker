<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- Top glow -->
  <ellipse cx="256" cy="80" rx="220" ry="90" fill="white" fill-opacity="0.07"/>

  <!-- Calendar card -->
  <rect x="64" y="88" width="384" height="310" rx="28" fill="white" fill-opacity="0.1" filter="url(#shadow)"/>

  <!-- Calendar header -->
  <rect x="64" y="88" width="384" height="86" rx="28" fill="white" fill-opacity="0.18"/>
  <rect x="64" y="146" width="384" height="28" fill="white" fill-opacity="0.08"/>

  <!-- Calendar pins -->
  <rect x="170" y="66" width="18" height="44" rx="9" fill="white" fill-opacity="0.65"/>
  <rect x="324" y="66" width="18" height="44" rx="9" fill="white" fill-opacity="0.65"/>

  <!-- Month + year label -->
  <text x="256" y="142" font-family="-apple-system, system-ui, sans-serif" font-size="30" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-0.5">April 2026</text>

  <!-- Day headers: M T W T F -->
  <text x="112" y="205" font-family="-apple-system, system-ui, sans-serif" font-size="19" fill="white" fill-opacity="0.55" text-anchor="middle" font-weight="600">M</text>
  <text x="196" y="205" font-family="-apple-system, system-ui, sans-serif" font-size="19" fill="white" fill-opacity="0.55" text-anchor="middle" font-weight="600">T</text>
  <text x="256" y="205" font-family="-apple-system, system-ui, sans-serif" font-size="19" fill="white" fill-opacity="0.55" text-anchor="middle" font-weight="600">W</text>
  <text x="316" y="205" font-family="-apple-system, system-ui, sans-serif" font-size="19" fill="white" fill-opacity="0.55" text-anchor="middle" font-weight="600">T</text>
  <text x="400" y="205" font-family="-apple-system, system-ui, sans-serif" font-size="19" fill="white" fill-opacity="0.55" text-anchor="middle" font-weight="600">F</text>

  <!-- Row 1: all present -->
  <circle cx="112" cy="252" r="27" fill="#22C55E"/>
  <circle cx="196" cy="252" r="27" fill="#22C55E"/>
  <circle cx="256" cy="252" r="27" fill="#22C55E"/>
  <circle cx="316" cy="252" r="27" fill="#22C55E"/>
  <circle cx="400" cy="252" r="27" fill="#22C55E"/>

  <polyline points="101,253 110,262 125,244" stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="185,253 194,262 209,244" stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="245,253 254,262 269,244" stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="305,253 314,262 329,244" stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="389,253 398,262 413,244" stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Row 2: present, absent, present, holiday, present -->
  <circle cx="112" cy="324" r="27" fill="#22C55E"/>
  <circle cx="196" cy="324" r="27" fill="#EF4444"/>
  <circle cx="256" cy="324" r="27" fill="#22C55E"/>
  <circle cx="316" cy="324" r="27" fill="#F97316"/>
  <circle cx="400" cy="324" r="27" fill="#22C55E"/>

  <polyline points="101,325 110,334 125,315" stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- X -->
  <line x1="185" y1="313" x2="207" y2="335" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="207" y1="313" x2="185" y2="335" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <polyline points="245,325 254,334 269,315" stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Holiday H -->
  <text x="316" y="332" font-family="-apple-system, system-ui, sans-serif" font-size="26" font-weight="700" fill="white" text-anchor="middle">H</text>
  <polyline points="389,325 398,334 413,315" stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Progress bar track -->
  <rect x="80" y="376" width="352" height="16" rx="8" fill="white" fill-opacity="0.18"/>
  <!-- Progress fill: 85% -->
  <rect x="80" y="376" width="299" height="16" rx="8" fill="url(#progress)"/>

  <!-- Attendance % label -->
  <text x="256" y="425" font-family="-apple-system, system-ui, sans-serif" font-size="26" font-weight="700" fill="white" fill-opacity="0.92" text-anchor="middle" letter-spacing="-0.3">85% Attendance</text>

  <!-- Bottom app name -->
  <text x="256" y="478" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="500" fill="white" fill-opacity="0.55" text-anchor="middle" letter-spacing="1.5">OFFICE TRACKER</text>
</svg>
