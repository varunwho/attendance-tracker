<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Calendar body -->
  <rect x="5" y="7" width="22" height="18" rx="3" fill="white" fill-opacity="0.2"/>
  <!-- Calendar header band -->
  <rect x="5" y="7" width="22" height="7" rx="3" fill="white" fill-opacity="0.3"/>
  <rect x="5" y="11" width="22" height="3" fill="white" fill-opacity="0.15"/>
  <!-- Calendar pins -->
  <rect x="10" y="5" width="2.5" height="5" rx="1.25" fill="white" fill-opacity="0.8"/>
  <rect x="19.5" y="5" width="2.5" height="5" rx="1.25" fill="white" fill-opacity="0.8"/>
  <!-- Checkmark circle -->
  <circle cx="16" cy="20" r="5" fill="#22C55E"/>
  <polyline points="13.2,20.2 15,22 18.8,17.8" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
